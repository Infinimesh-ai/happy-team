# ISCP integration harness: the upstream Go reference services (relay +
# trust root), built directly from the pinned commit recorded in
# packages/iscp/scripts/pin.json. In-memory state (no postgres): each
# `up` starts clean, which is exactly what the integration suite wants.
#
#   docker compose -f environments/iscp/docker-compose.yaml up --build -d
#   ISCP_HARNESS=1 pnpm --filter @slopus/iscp test:integration
#   docker compose -f environments/iscp/docker-compose.yaml down
#
# local-lab profile + no admin token: admin endpoints (device authorize,
# revoke) are open, which the test suite uses to play the operator role.
services:
  relay:
    build:
      context: https://github.com/Infinimesh-ai/ISCP.git#413d767bd8b47a8c6b7430115bf60dc283aebbc0
      dockerfile: services/relay-reference/Dockerfile
    environment:
      ISCP_PROFILE: local-lab
      ISCP_DOMAIN_ID: local
      ISCP_RELAY_ID: relay-local
      ISCP_RELAY_ADDR: :8080
      ISCP_RELAY_BASE_URL: http://localhost:18080
      ISCP_RELAY_WS_URL: ws://localhost:18080/v2/relay/connect
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "/relayd", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  trust-root:
    build:
      context: https://github.com/Infinimesh-ai/ISCP.git#413d767bd8b47a8c6b7430115bf60dc283aebbc0
      dockerfile: services/trust-root-reference/Dockerfile
    environment:
      ISCP_PROFILE: local-lab
      ISCP_DOMAIN_ID: local
      ISCP_TRUST_ROOT_ID: trust-local
      ISCP_TRUST_ADDR: :8081
      ISCP_TRUST_BASE_URL: http://localhost:18081
    ports:
      - "127.0.0.1:18081:8081"
    healthcheck:
      test: ["CMD", "/trustd", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
