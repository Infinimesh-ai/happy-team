name: happy-team

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-happy}
      POSTGRES_USER: ${POSTGRES_USER:-happy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-happyminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before starting}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-happyminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before starting}
      MINIO_BUCKET: ${MINIO_BUCKET:-happy-team}
    entrypoint: /bin/sh
    command: >
      -c "until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 2; done;
      mc mb -p \"local/$${MINIO_BUCKET}\";
      mc anonymous set download \"local/$${MINIO_BUCKET}\""

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DB_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-happy}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env before starting}@postgres:5432/${POSTGRES_DB:-happy}?schema=public
      REDIS_URL: redis://redis:6379
      HANDY_MASTER_SECRET: ${HANDY_MASTER_SECRET:?Set HANDY_MASTER_SECRET to a strong random value before starting}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL for the initial Team admin before starting}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD for the initial Team admin before starting}
      PORT: 3005
      PUBLIC_URL: ${HAPPY_PUBLIC_SERVER_URL:-http://localhost:3005}
      TEAM_PUBLIC_SERVER_URL: ${TEAM_PUBLIC_SERVER_URL:-${HAPPY_PUBLIC_SERVER_URL:-http://localhost:3005}}
      TEAM_CLI_ARTIFACT_PATH: /opt/happy-team/artifacts/happy-cli.tgz
      TEAM_NODE_ARTIFACT_DIR: ${TEAM_NODE_ARTIFACT_DIR:-/opt/happy-team/artifacts/node}
      TEAM_ANTHROPIC_API_KEY: ${TEAM_ANTHROPIC_API_KEY:-}
      TEAM_ANTHROPIC_BASE_URL: ${TEAM_ANTHROPIC_BASE_URL:-}
      TEAM_OPENAI_API_KEY: ${TEAM_OPENAI_API_KEY:-}
      TEAM_OPENAI_BASE_URL: ${TEAM_OPENAI_BASE_URL:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      S3_HOST: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-happyminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env before starting}
      S3_BUCKET: ${MINIO_BUCKET:-happy-team}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/happy-team}
    volumes:
      - ${TEAM_NODE_ARTIFACT_HOST_DIR:-./.team-artifacts/node}:/opt/happy-team/artifacts/node:ro
    command: >
      sh -c "pnpm --filter happy-server exec prisma migrate deploy --schema=prisma/schema.prisma &&
      exec pnpm --filter happy-server start"
    ports:
      - "${HAPPY_SERVER_PORT:-3005}:3005"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3005/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 30

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
      args:
        HAPPY_SERVER_URL: ${HAPPY_PUBLIC_SERVER_URL:-http://localhost:3005}
        POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
        REVENUE_CAT_STRIPE: ${REVENUE_CAT_STRIPE:-}
        HAPPY_BUILD_COMMIT_SHA: ${HAPPY_BUILD_COMMIT_SHA:-}
        HAPPY_BUILD_COMMIT_TIMESTAMP: ${HAPPY_BUILD_COMMIT_TIMESTAMP:-}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${HAPPY_WEB_PORT:-8080}:80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      server:
        condition: service_healthy
      webapp:
        condition: service_started
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
